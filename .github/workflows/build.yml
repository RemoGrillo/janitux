name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fresh runners: retry flaky mirrors, and wait for the dpkg lock that
  # unattended upgrades may hold right after boot instead of failing.
  APT: sudo apt-get -o Acquire::Retries=5 -o DPkg::Lock::Timeout=600

jobs:
  test:
    name: Tests on the oldest supported stack (Ubuntu 24.04, GTK 4.14, libadwaita 1.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          $APT update
          $APT install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 desktop-file-utils appstream xvfb dbus-bin
      - name: Unit tests and metadata validation
        run: make check
      - name: Smoke test (start the app, scan a folder, draw the results)
        env:
          GSK_RENDERER: cairo
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 15 python3 -m janitux /usr/share 2> stderr.log
          code=$?
          set -e
          cat stderr.log
          if [ "$code" != 124 ]; then echo "::error::the app exited early (code $code)"; exit 1; fi
          if grep -q Traceback stderr.log; then echo "::error::Python traceback while running"; exit 1; fi

  packages:
    name: .deb, .rpm, .pyz, source
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install nfpm
        run: |
          curl -sSfLO https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          curl -sSfLO https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt
          grep " nfpm_2.48.0_Linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf nfpm_2.48.0_Linux_x86_64.tar.gz nfpm
      - name: Build
        run: make deb rpm pyz dist NFPM=./nfpm
      - name: Install and run the .deb
        run: |
          $APT update
          $APT install -y ./dist/janitux_*_all.deb
          test -x /usr/bin/janitux
          python3 -c 'import sys; sys.path.insert(0, "/usr/share/janitux"); import janitux.window'
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

  arch:
    name: Arch Linux package
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed python python-gobject gtk4 libadwaita
      - uses: actions/checkout@v7
      - name: Build with makepkg
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "make arch"
      - name: Install the package
        run: pacman -U --noconfirm dist/janitux-*-any.pkg.tar.zst && test -x /usr/bin/janitux
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  flatpak:
    name: Flatpak bundle
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak-builder
        run: |
          $APT update
          $APT install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: make flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, arch, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the version in the code
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' janitux/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but code says $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "Janitux ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
